# Text reminders: every 15 minutes, ask the site to send any reminders that are due.
# It needs two repository secrets (Settings > Secrets and variables > Actions):
#   SITE_URL     the site's address, like https://dunya-family.com
#   CRON_SECRET  the same long random string as CRON_SECRET in Vercel
# Until both are there, it does nothing.
name: Text reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send reminders that are due
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Text reminders aren't set up yet (SITE_URL and CRON_SECRET secrets). Skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/reminders"
